md_name = "Water_160k PME NVE test"
mode = "nve"
step_limit = 1000
dt = 0.001
cutoff = 8.0
constrain_mode = "SETTLE"
gromacs_top = "water.top"
gromacs_gro = "water_npt_eq.gro"
mdout = "mdout.txt"
mdinfo = "mdinfo.txt"
