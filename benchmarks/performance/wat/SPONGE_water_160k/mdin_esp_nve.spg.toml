md_name = "Water_160k ESP NVE test"
mode = "nve"
step_limit = 1000
dt = 0.001
cutoff = 8.0
constrain_mode = "SETTLE"
gromacs_top = "water.top"
gromacs_gro = "water_npt_eq.gro"
mdout = "mdout.txt"
mdinfo = "mdinfo.txt"
frc = "frc.dat"
print_zeroth_frame = 1
write_information_interval = 1000
write_mdout_interval = 1000
write_trajectory_interval = 1000
write_restart_file_interval = 1000
dont_check_input = 1

[PM]
backend = "esp"
Direct_Tolerance = 1e-4
print_detail = true
esp_tolerance = 1e-4
esp_table_mode = "poly"
esp_table_points = 1024
esp_print_detail = true
